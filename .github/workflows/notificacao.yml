name: Notificação diária

on:
  schedule:
    # 06:50 em Brasília (UTC-3), segunda a sexta. O GitHub costuma atrasar alguns minutos,
    # então a notificação chega por volta das 07:00.
    - cron: "50 9 * * 1-5"
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar uma notificação de teste mesmo fora dos dias de lição"
        type: boolean
        default: true

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/notificar.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TESTE: ${{ inputs.teste && '1' || '' }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
